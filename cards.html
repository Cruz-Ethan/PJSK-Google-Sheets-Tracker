<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" type="image/x-icon" href="https://cdn2.cdnstep.com/NxeQPF9CoYXp4o0PLntC/cover-1.thumb256.png">
    <script src="https://kit.fontawesome.com/25180c9a39.js" crossorigin="anonymous"></script>
    <script src="views/cards.js" type="module" defer></script>
</head>

<body class="flex flex-col lg:grid lg:grid-cols-12 min-h-screen">
    <header class="p-5 col-span-2 shadow-lg z-10 relative flex flex-col gap-2">
        <button id="openNavbarButton" class="lg:hidden self-end cursor-pointer">
            <i class="fa-solid fa-bars fa-xl text-gray-500"></i>
        </button>
        <button id="closeNavbarButton" class="hidden lg:hidden self-end cursor-pointer">
            <i class="fa-solid fa-xmark fa-xl text-gray-500"></i>
        </button>
        <nav id="navbar" class="sticky top-5 hidden lg:block">
        <nav class="sticky top-5">
            <ul class="flex flex-col gap-2">
                <li class="p-2 text-gray-500 rounded hover:bg-gray-100 transition duration-100 cursor-pointer text-center lg:text-start"><a href="index.html" class="font-semibold block w-full">Enter ID</a></li>
                <li class="p-2 text-gray-500 rounded hover:bg-gray-100 transition duration-100 cursor-pointer text-center lg:text-start"><a href="dashboard.html" class="font-semibold block w-full">Dashboard</a></li>
                <li class="p-2 text-gray-500 rounded hover:bg-gray-100 transition duration-100 cursor-pointer text-center lg:text-start"><a href="shows.html" class="font-semibold block w-full">Shows</a></li>
                <li class="p-2 text-gray-500 rounded hover:bg-gray-100 transition duration-100 cursor-pointer text-center lg:text-start"><a href="songs.html" class="font-semibold block w-full">Songs</a></li>
                <li class="p-2 text-gray-500 rounded hover:bg-gray-100 transition duration-100 cursor-pointer text-center lg:text-start"><a href="characters.html" class="font-semibold block w-full">Characters</a></li>
                <li class="p-2 bg-emerald-200 rounded text-center lg:text-start"><a href="cards.html" class="font-semibold block w-full">Cards</a></li>
                <li class="p-2 text-gray-500 rounded hover:bg-gray-100 transition duration-100 cursor-pointer text-center lg:text-start"><a href="teams.html" class="font-semibold block w-full">Teams</a></li>
                <li class="p-2 text-gray-500 rounded hover:bg-gray-100 transition duration-100 cursor-pointer text-center lg:text-start"><a href="credits.html" class="font-semibold block w-full">Credits</a></li>
            </ul>
        </nav>
    </header>
    <main class="p-5 col-span-10 h-full bg-slate-100 flex-1">
        <section>
            <h1 class="text-2xl lg:text-3xl font-semibold my-3">Card Database</h1>
            <div class="bg-white shadow mb-4 flex flex-col justify-between p-4 gap-4 rounded">
                <div class="flex gap-2 items-center">
                    <label for="cardTitle">Title:</label>
                    <input class="px-1 border border-slate-300 rounded flex-1" type="text" id="cardTitle" name="cardTitle">
                </div>
                <div class="gap-4 grid sm:grid-cols-2 lg:grid-cols-4 grid grid-cols-1">
                    <div class="flex gap-2">
                        <label for="minLevel" class="text-nowrap">Min Level:</label>
                        <input value="0" type="number" class="px-1 border border-slate-300 rounded flex-1 min-w-0" id="minLevel" name="minLevel">
                    </div>
                    <div class="flex gap-2">
                        <label for="maxLevel" class="text-nowrap">Max Level:</label>
                        <input value="60" type="number" class="px-1 border border-slate-300 rounded flex-1 min-w-0" id="maxLevel" name="maxLevel">
                    </div>
                    <div class="flex gap-2">
                        <label for="minTalent" class="text-nowrap">Min Talent:</label>
                        <input value="0" type="number" class="px-1 border border-slate-300 rounded flex-1 min-w-0" id="minTalent" name="minTalent">
                    </div>
                    <div class="flex gap-2">
                        <label for="maxTalent" class="text-nowrap">Max Talent:</label>
                        <input value="40000" type="number" class="px-1 border border-slate-300 rounded flex-1 min-w-0" id="maxTalent" name="maxTalent">
                    </div>
                    <div class="flex gap-2">
                        <label for="minSkillLevel" class="text-nowrap">Min Skill Level:</label>
                        <input value="1" type="number" class="px-1 border border-slate-300 rounded flex-1 min-w-0" id="minSkillLevel" name="minSkillLevel">
                    </div>
                    <div class="flex gap-2">
                        <label for="maxSkillLevel" class="text-nowrap">Max Skill Level:</label>
                        <input value="4" type="number" class="px-1 border border-slate-300 rounded flex-1 min-w-0" id="maxSkillLevel" name="maxSkillLevel">
                    </div>
                    <div class="flex gap-2">
                        <label for="minRank" class="text-nowrap">Min Rank:</label>
                        <input value="0" type="number" class="px-1 border border-slate-300 rounded flex-1 min-w-0" id="minRank" name="minRank">
                    </div>
                    <div class="flex gap-2">
                        <label for="maxRank" class="text-nowrap">Max Rank:</label>
                        <input value="5" type="number" class="px-1 border border-slate-300 rounded flex-1 min-w-0" id="maxRank" name="maxRank">
                    </div>
                    <div class="flex gap-2">
                        <label for="minScoreBoost" class="text-nowrap">Min Score Boost:</label>
                        <input value="0" type="number" class="px-1 border border-slate-300 rounded flex-1 min-w-0" id="minScoreBoost" name="minScoreBoost">
                    </div>
                    <div class="flex gap-2">
                        <label for="maxScoreBoost" class="text-nowrap">Max Score Boost:</label>
                        <input value="150" type="number" class="px-1 border border-slate-300 rounded flex-1 min-w-0" id="maxScoreBoost" name="maxScoreBoost">
                    </div>
                    <div class="flex gap-2">
                        <label for="minHealthBoost" class="text-nowrap">Min Health Boost:</label>
                        <input value="0" type="number" class="px-1 border border-slate-300 rounded flex-1 min-w-0" id="minHealthBoost" name="minHealthBoost">
                    </div>
                    <div class="flex gap-2">
                        <label for="maxHealthBoost" class="text-nowrap">Max Health Boost:</label>
                        <input value="850" type="number" class="px-1 border border-slate-300 rounded flex-1 min-w-0" id="maxHealthBoost" name="maxHealthBoost">
                    </div>
                </div>
                <div class="gap-4 grid sm:grid-cols-4 grid grid-cols-[repeat(auto-fit,_minmax(200px,_1fr))">
                    <button id="characterSelectButton" class="border border-slate-300 rounded cursor-pointer px-3 py-1 relative text-start [&:not(:has(#characterSelectList:hover)):hover]:bg-slate-100 transition duration-100">
                        Characters
                        <ul id="characterSelectList" class="z-10 overflow-y-auto absolute top-9 left-0 right-0 h-30 whitespace-nowrap bg-white rounded border border-slate-300 overflow-hidden hidden"></ul>
                    </button>
                    <button id="attributeSelectButton" class="border border-slate-300 rounded cursor-pointer px-3 py-1 relative text-start [&:not(:has(#attributeSelectList:hover)):hover]:bg-slate-100 transition duration-100">
                        Attributes
                        <ul id="attributeSelectList" class="z-10 overflow-y-auto absolute top-9 left-0 right-0 h-30 whitespace-nowrap bg-white rounded border border-slate-300 overflow-hidden hidden"></ul>
                    </button>
                    <button id="raritySelectButton" class="border border-slate-300 rounded cursor-pointer px-3 py-1 relative text-start [&:not(:has(#raritySelectList:hover)):hover]:bg-slate-100 transition duration-100">
                        Rarities
                        <ul id="raritySelectList" class="z-10 overflow-y-auto absolute top-9 left-0 right-0 h-30 whitespace-nowrap bg-white rounded border border-slate-300 overflow-hidden hidden"></ul>
                    </button>
                    <button id="supportUnitSelectButton" class="border border-slate-300 rounded cursor-pointer px-3 py-1 relative text-start [&:not(:has(#supportUnitSelectList:hover)):hover]:bg-slate-100 transition duration-100">
                        Support Units
                        <ul id="supportUnitSelectList" class="z-10 overflow-y-auto absolute top-9 left-0 right-0 h-30 whitespace-nowrap bg-white rounded border border-slate-300 overflow-hidden hidden"></ul>
                    </button>
                    <button id="skillTypeSelectButton" class="border border-slate-300 rounded cursor-pointer px-3 py-1 relative text-start [&:not(:has(#skillTypeSelectList:hover)):hover]:bg-slate-100 transition duration-100">
                        Skill Types
                        <ul id="skillTypeSelectList" class="z-10 overflow-y-auto absolute top-9 left-0 right-0 h-30 whitespace-nowrap bg-white rounded border border-slate-300 overflow-hidden hidden"></ul>
                    </button>
                    <button id="trainedSelectButton" class="border border-slate-300 rounded cursor-pointer px-3 py-1 relative text-start [&:not(:has(#trainedSelectList:hover)):hover]:bg-slate-100 transition duration-100">
                        Trained
                        <ul id="trainedSelectList" class="z-10 overflow-y-auto absolute top-9 left-0 right-0 h-30 whitespace-nowrap bg-white rounded border border-slate-300 overflow-hidden hidden"></ul>
                    </button>
                </div>
            </div>
            <ul class="grid grid-cols-[repeat(auto-fit,_minmax(200px,_1fr))] gap-4" id="cardList"></ul>
        </section>
    </main>
</body>

</html>
