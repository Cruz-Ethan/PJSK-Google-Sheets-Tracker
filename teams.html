<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" type="image/x-icon" href="https://cdn2.cdnstep.com/NxeQPF9CoYXp4o0PLntC/cover-1.thumb256.png">
    <script src="views/teams.js" type="module" defer></script>
</head>

<body class="grid grid-cols-12 min-h-screen">
    <header class="p-5 col-span-2 shadow-lg z-10 relative">
        <nav class="sticky top-5">
            <ul class="flex flex-col gap-2">
                <li class="p-2 text-gray-500 rounded hover:bg-gray-100 transition duration-100 cursor-pointer"><a href="index.html" class="font-semibold block w-full">Enter ID</a></li>
                <li class="p-2 text-gray-500 rounded hover:bg-gray-100 transition duration-100 cursor-pointer"><a href="dashboard.html" class="font-semibold block w-full">Dashboard</a></li>
                <li class="p-2 text-gray-500 rounded hover:bg-gray-100 transition duration-100 cursor-pointer"><a href="shows.html" class="font-semibold block w-full">Shows</a></li>
                <li class="p-2 text-gray-500 rounded hover:bg-gray-100 transition duration-100 cursor-pointer"><a href="songs.html" class="font-semibold block w-full">Songs</a></li>
                <li class="p-2 text-gray-500 rounded hover:bg-gray-100 transition duration-100 cursor-pointer"><a href="characters.html" class="font-semibold block w-full">Characters</a></li>
                <li class="p-2 text-gray-500 rounded hover:bg-gray-100 transition duration-100 cursor-pointer"><a href="cards.html" class="font-semibold block w-full">Cards</a></li>
                <li class="p-2 bg-emerald-200 rounded"><a href="teams.html" class="font-semibold block w-full">Teams</a></li>
            </ul>
        </nav>
    </header>
    <main class="p-5 col-span-10 h-full bg-slate-100 ">
        <section>
            <h1 class="text-3xl font-semibold m-3">Team Database</h1>
            <form class="bg-white shadow mb-4 flex flex-col justify-between p-4 gap-2 rounded">
                <div class="flex gap-2 items-center">
                    <label for="cardTitle">Title:</label>
                    <input class="border border-slate-300 rounded flex-1 px-1" type="text" id="cardTitle" name="cardTitle">
                </div>
                <div class="flex items-center gap-2">
                    <label for="talent">Talent:</label>
                    <input class="px-1 border border-slate-300 rounded" type="number" id="talent" name="talent">
                    <label for="healthBoost">Health Boost:</label>
                    <input class="px-1 border border-slate-300 rounded" type="number" id="healthBoost" name="healthBoost">
                    <label for="scoreBoost">Score Boost:</label>
                    <input class="px-1 border border-slate-300 rounded" type="number" id="scoreBoost" name="scoreBoost">
                </div>
            </form>
            <ul class="flex flex-col gap-4" id="teamsList"></ul>
        </section>
    </main>
</body>

</html>
